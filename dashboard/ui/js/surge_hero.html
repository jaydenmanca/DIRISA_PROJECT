<section class="sh" aria-label="The 2026 forecast: registered voters, expected ballots and 10,000 simulated elections">
  <div class="sh-left">
    <div class="sh-kicker">4 November 2026 · <span id="sh-countdown"></span> · Mpumalanga local elections</div>
    <h1 class="sh-title">A record voters&rsquo; roll.<br><em>Will it turn into votes?</em></h1>
    <div class="sh-text in">
      <div class="sh-eyebrow" id="sh-eyebrow"></div>
      <div class="sh-big" id="sh-big"></div>
      <div class="sh-unit" id="sh-unit"></div>
      <ul class="sh-body" id="sh-body"></ul>
    </div>
    <div class="sh-steps" role="group" aria-label="Story steps">
      <button><span>1</span> The 2026 roll</button>
      <button><span>2</span> The forecast</button>
      <button><span>3</span> 10,000 simulations</button>
      <button id="sh-replay" class="replay" aria-label="Replay the animation">&#8635; Replay</button>
    </div>
  </div>
  <div class="sh-right">
    <div class="sh-stage">
      <svg id="sh-grid" role="img" aria-label="Unit chart: each dot is 1,000 registered voters; lit dots are expected ballots"></svg>
      <svg id="sh-hist" role="img" aria-label="Histogram of 10,000 simulated 2026 turnouts; red dots are below the 2021 record low"></svg>
    </div>
    <div class="sh-key grid-key"><span class="k roll"></span>Registered 2026 <span class="k lit"></span>Expected to vote <span class="k home"></span>Expected to stay home · <em>1 dot = 1,000 voters</em></div>
    <div class="sh-key hist-key" style="display:none"><span class="k red"></span>Below the 2021 record low <span class="k blue"></span>Above it · <em>1 dot = 10 simulated elections</em></div>
  </div>
</section>
